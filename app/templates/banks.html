{% extends "base.html" %}
{% block title %}我的题库{% endblock %}
{% block body %}
<nav class="navbar">
  <a href="/" class="nav-logo">
    <div class="logo-box"><i data-lucide="brain-circuit" style="width:18px;height:18px"></i></div>
    QuizAI
  </a>
  <div class="nav-links">
    <a href="/">功能</a>
    <a href="/banks" class="active">我的题库</a>
    <a href="/wrong">错题本</a>
  </div>
  <a href="/" class="btn btn-primary"><i data-lucide="plus" style="width:14px"></i> 新建题库</a>
</nav>

<div class="page-body">
  <aside class="sidebar" id="categorySidebar">
    <div class="sidebar-title">题库分类</div>
    <div class="side-item side-item-all active" data-category="">
      <span class="side-item-left">
        <i data-lucide="layers"></i>
        <span>全部</span>
      </span>
      <span class="side-item-count" id="allBanksCount">0</span>
    </div>
    <div class="sidebar-spacer"></div>
    <a href="/wrong" class="side-wrong">
      <i data-lucide="bookmark"></i>
      <span id="sideWrongText">错题本 · 0道</span>
    </a>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <h2 class="page-title">我的题库</h2>
        <p class="page-subtitle" id="bankSubtitle">管理 AI 生成的题库</p>
      </div>
      <div class="search-box">
        <i data-lucide="search" style="width:14px;color:var(--fg-secondary)"></i>
        <input type="text" id="searchInput" placeholder="搜索题库…" />
      </div>
    </div>

    <div class="card-grid" id="cardGrid">
      <a href="/" class="new-card">
        <i data-lucide="plus" style="width:32px;color:var(--accent)"></i>
        <strong>新建题库</strong>
        <span class="new-card-desc">上传资料，AI 自动生成</span>
      </a>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="editModal" hidden>
  <div class="modal-box" role="dialog" aria-labelledby="editModalTitle">
    <h3 class="modal-title" id="editModalTitle">编辑题库</h3>
    <label class="modal-label" for="editTitle">题库名称</label>
    <input type="text" class="modal-input" id="editTitle" placeholder="请输入题库名称" maxlength="200" />
    <label class="modal-label" for="editCategory">分类</label>
    <input
      type="text"
      class="modal-input"
      id="editCategory"
      list="editCategoryList"
      placeholder="输入分类，可参考下方已有分类"
      maxlength="100"
      autocomplete="off"
    />
    <datalist id="editCategoryList"></datalist>
    <p class="modal-hint">输入新分类后，左侧会自动汇总并支持点击筛选</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="editCancel">取消</button>
      <button type="button" class="btn btn-primary" id="editSave">保存</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/banks.js"></script>
{% endblock %}
